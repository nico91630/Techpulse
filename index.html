<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1222"><title>TechPulse | Actualités tech</title><style>:root{color-scheme:dark;--bg:#080d17;--panel:#111b2b;--border:#26354a;--muted:#9dafc6;--accent:#53d2ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#142c42 0,transparent 48%),var(--bg);color:#f0f5fb;font:15px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{padding:18px max(20px,calc((100vw - 1200px)/2));border-bottom:1px solid #233247;background:#0b1423dd;position:sticky;top:0;z-index:5;backdrop-filter:blur(18px)}h1{margin:0;font-size:25px;letter-spacing:-1.1px;font-weight:800}h1 span{color:var(--accent)}header p{margin:0;color:var(--muted);font-size:12px}.wrap{max-width:1200px;margin:auto;padding:26px 20px 70px}.hero{position:relative;overflow:hidden;border:1px solid #28455a;padding:34px 38px;border-radius:22px;background:linear-gradient(120deg,#17394b,#122238 60%,#101b30);margin-bottom:25px}.hero:after{content:'⚡';position:absolute;right:42px;top:-54px;font-size:190px;opacity:.09;transform:rotate(-13deg);pointer-events:none}.hero h2{font-size:clamp(26px,4vw,42px);line-height:1.15;letter-spacing:-1.4px;margin:0 0 12px;max-width:670px}.hero p{color:#b7cce0;margin:0;max-width:630px}.tabs{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 15px;scrollbar-width:thin;scrollbar-color:#38526a transparent}.tabs button{border:1px solid #30435a;background:#142136;color:#c8d7e7;padding:10px 16px;border-radius:12px;white-space:nowrap;cursor:pointer;font:600 13px system-ui;transition:.18s}.tabs button:hover{border-color:#53d2ed;color:white}.tabs button.active{background:#d8f7ff;border-color:#d8f7ff;color:#0a2030;box-shadow:0 3px 18px #53d2ed22}.search-wrap{position:relative;margin:8px 0 12px}.search-wrap:before{content:'⌕';position:absolute;left:17px;top:7px;font-size:27px;color:#8ba7c0;pointer-events:none}input{width:100%;padding:15px 18px 15px 49px;background:#101d2e;border:1px solid #34475d;border-radius:14px;color:white;font-size:15px;outline:none}input:focus{border-color:#53d2ed;box-shadow:0 0 0 3px #53d2ed18}input::placeholder{color:#8fa4bc}.meta{color:var(--muted);margin:20px 0 15px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:17px}.card{background:linear-gradient(160deg,#162337,#101a29);border:1px solid var(--border);border-radius:18px;padding:23px;display:flex;flex-direction:column;min-height:245px;transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);border-color:#47728a;box-shadow:0 15px 35px #0004}.tag{font-size:11px;color:#78d8ef;font-weight:800;letter-spacing:.4px;text-transform:uppercase}.card h3{font-size:18px;line-height:1.38;letter-spacing:-.35px;margin:13px 0 9px}.card p{color:#aebfd0;line-height:1.55;flex:1;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.card footer{display:flex;justify-content:space-between;align-items:center;color:#91a8bf;font-size:11px;gap:10px;border-top:1px solid #29384a;padding-top:14px;margin-top:13px}.card a{color:#7cdef4;text-decoration:none;font-size:12px;font-weight:750;white-space:nowrap}.card a:hover{text-decoration:underline}.empty{padding:30px;background:#142136;border:1px solid #30435a;border-radius:15px;color:#c8d5e5;grid-column:1/-1}.refresh{border:0;border-radius:9px;padding:10px 13px;background:#1c6ea7;color:white;cursor:pointer}@media(max-width:640px){header{padding:13px 17px}h1{font-size:23px}.wrap{padding:18px 14px 45px}.hero{padding:25px 22px;border-radius:17px;margin-bottom:18px}.hero:after{right:-5px;font-size:135px;top:-28px}.hero h2{font-size:28px;max-width:260px}.hero p{font-size:13px;max-width:270px}.grid{grid-template-columns:1fr;gap:12px}.card{min-height:205px;padding:20px}.tabs button{padding:10px 13px}.card h3{font-size:18px}}@media(prefers-reduced-motion:reduce){.card,.tabs button{transition:none}.card:hover{transform:none}}:root{--accent:#8de7dd;--border:#263445}body{background:radial-gradient(ellipse at 90% 0%,#143b42 0,transparent 33%),#080e17}header{box-shadow:0 8px 35px #0003}header h1{display:flex;align-items:center;gap:5px}header h1 span{color:#8de7dd}header p{letter-spacing:.3px}.wrap{max-width:1280px}.hero{background:linear-gradient(112deg,#153a3d 0%,#132737 57%,#182438 100%);border-color:#2a5658;padding:42px 44px;min-height:205px;display:flex;flex-direction:column;justify-content:center}.hero:before{content:'VEILLE TECHNOLOGIQUE  •  EN DIRECT';font-size:10px;letter-spacing:2px;color:#9ff2e4;font-weight:800;margin-bottom:15px}.hero h2{font-size:clamp(30px,4.6vw,51px);max-width:770px;letter-spacing:-2px}.hero p{font-size:14px}.tabs{margin:5px 0 10px}.tabs button{border-radius:9px;background:#101c2a}.tabs button.active{background:#8de7dd;border-color:#8de7dd;color:#102b2e;box-shadow:none}.search-wrap{max-width:100%;margin-bottom:9px}input{background:#101b29;border-color:#2a3a4d}.meta{margin:0;color:#95a9b9}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:28px 0 17px}.section-head h2{font-size:23px;letter-spacing:-.7px;margin:0}.section-head .eyebrow{font-size:10px;font-weight:800;color:#83d8cc;letter-spacing:1.7px;text-transform:uppercase}.section-head .count{font-size:12px;color:#91a5b7}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{position:relative;background:#111c2a;border-color:#29384a;border-radius:15px;min-height:265px;padding:24px;box-shadow:0 8px 28px #0002}.card:before{content:'';position:absolute;top:0;left:24px;right:24px;height:2px;background:linear-gradient(90deg,#8de7dd,transparent);opacity:.35}.card h3{font-size:19px;line-height:1.34;margin-top:16px}.card p{font-size:13px;color:#9fb2c3}.card footer{border-color:#293747}.tag{color:#86dfd3;font-size:10px;letter-spacing:.9px}.card a{color:#8de7dd}.card.featured{grid-column:span 2;min-height:350px;padding:35px;background:radial-gradient(ellipse at 90% 10%,#1a5550 0,transparent 54%),linear-gradient(135deg,#1b3440,#111d2d);border-color:#37615f;justify-content:flex-end}.card.featured:after{content:'À LA UNE';position:absolute;top:27px;right:28px;color:#a8f2e6;font-size:10px;letter-spacing:1.5px;font-weight:800}.card.featured h3{font-size:clamp(25px,2.8vw,35px);max-width:680px;letter-spacing:-1px;margin:15px 0}.card.featured p{font-size:15px;max-width:640px;flex:0;-webkit-line-clamp:3}.card.featured footer{margin-top:24px}.card.featured .tag{font-size:11px}.empty{grid-column:1/-1}@media(min-width:901px){.card:not(.featured):nth-child(2){background:linear-gradient(145deg,#182b3a,#101c2a);border-color:#34485b}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card.featured{grid-column:span 2}}@media(max-width:640px){.wrap{padding:15px 14px 45px}.hero{min-height:190px;padding:25px 23px}.hero:before{font-size:9px;margin-bottom:13px}.hero h2{font-size:31px;letter-spacing:-1.1px}.hero p{font-size:12px}.section-head{margin:24px 0 14px}.section-head h2{font-size:21px}.grid{grid-template-columns:1fr;gap:13px}.card{min-height:215px;padding:21px}.card.featured{grid-column:span 1;min-height:290px;padding:24px}.card.featured h3{font-size:25px}.card.featured p{font-size:13px}.card.featured:after{top:19px;right:18px;font-size:9px}.card h3{font-size:18px}.tabs{margin-bottom:5px}}.subtopics{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:13px 0;border-bottom:1px solid #26394a}.subtopics[hidden]{display:none}.subtopics button{cursor:pointer;border:1px solid #36505a;background:#10252c;color:#b9d8d8;padding:8px 13px;border-radius:30px;font:600 12px system-ui}.subtopics button.active{background:#8de7dd;color:#092a29;border-color:#8de7dd}.tabs{scroll-padding-inline:10px}@media(max-width:640px){.subtopics{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}.subtopics button{flex-shrink:0}}</style></head><body><header><h1>⚡ Tech<span>Pulse</span></h1><p>L'actualité technologique, sans bruit</p></header><main class="wrap"><section class="hero"><h2>L’essentiel de la tech. Sans le bruit.</h2><p>Innovations, automatisme, électricité, énergie et technologies qui comptent.</p></section><nav class="tabs" id="tabs" aria-label="Rubriques"></nav><div class="subtopics" id="subtopics" aria-label="Sous-thèmes"></div><div class="search-wrap"><input id="search" aria-label="Rechercher les actualités" placeholder="Rechercher une marque, un sujet, une technologie…"></div><div class="section-head"><div><div class="eyebrow">LE FIL TECHPULSE</div><h2 id="section-title">Les actualités à suivre</h2></div><span class="count" id="meta">Chargement…</span></div><div id="articles" class="grid"></div></main><script>const cats=['Tout','IA','Domotique','Industrie 4.0','Énergie & Électricité','Innovations Tech','Cybersécurité','Smartphones','Gaming'];const topics={'Industrie 4.0':['Tous','Automatisme','Robotique','SCADA','Capteurs','Réseaux','Maintenance IA'],'Énergie & Électricité':['Tous','Électricité','Énergie'],'Innovations Tech':['Tous','Innovation','Informatique','Électronique','Mobilité']};let selected='Tout',subtopic='Tous',all=[],trendSignals=[];const tabs=document.querySelector('#tabs'),subtopics=document.querySelector('#subtopics'),grid=document.querySelector('#articles'),meta=document.querySelector('#meta'),sectionTitle=document.querySelector('#section-title'),search=document.querySelector('#search');function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function groupFor(a){const c=a.category;if(c==='Automatisme'||c==='Industrie 4.0')return 'Industrie 4.0';if(c==='Énergie'||c==='Électricité')return 'Énergie & Électricité';if(['Innovation','Informatique','Électronique','Mobilité'].includes(c))return 'Innovations Tech';return c}function topicFor(a){const t=(a.title+' '+(a.description||'')).toLocaleLowerCase();if(groupFor(a)==='Industrie 4.0'){if(/robot|cobot|bras articulé/.test(t))return 'Robotique';if(/scada|supervision|pcvue|panorama|topkapi|ihm|hmi/.test(t))return 'SCADA';if(/capteur|sonde|débitmètre|instrumentation|mesure industrielle/.test(t))return 'Capteurs';if(/opc ua|mqtt|modbus|profinet|ethernet industriel|réseau industriel|iiot/.test(t))return 'Réseaux';if(/maintenance prédictive|maintenance predictive|détection de panne|surveillance conditionnelle/.test(t))return 'Maintenance IA';return 'Automatisme'}return a.category}function render(){tabs.innerHTML=cats.map(c=>`<button class="${selected===c?'active':''}" data-cat="${safe(c)}">${safe(c)}</button>`).join('');subtopics.innerHTML=(topics[selected]||[]).map(t=>`<button class="${subtopic===t?'active':''}" data-topic="${safe(t)}">${safe(t)}</button>`).join('');subtopics.hidden=!topics[selected];const q=search.value.toLocaleLowerCase();let data=all.filter(a=>{const t=[a.title,a.description].join(' ').toLocaleLowerCase();const deal=/bon plan|bons plans|promo|réduction|reduction|remise|soldes|code promo|offre flash|prix cassé|black friday/.test(t);const phone=/smartphone|téléphone|telephone|iphone|galaxy|pixel|xiaomi|oneplus|redmi|samsung|honor|poco/.test(t);const innovative=/nouveau|nouvelle|innovation|invention|prototype|percée|découverte|dévoile|lance|développ|technologie|révolution|premièr|record|brevet|robot|scientifi|quantique|fibre optique|batterie|processeur|capteur|matériau|matériel|équipement/i.test(a.title);const noise=/xavier niel|députés|taxe|impôt|politique|dirigeant|patron|forfait|black friday|bon plan|promo|soldes|meilleur|comparatif|guide d'achat|interview|publicité/i.test(a.title);const relevant=a.category!=='Innovation'||(innovative&&!noise);return relevant&&(selected!=='Tout'||(a.category!=='Gaming'&&a.category!=='Smartphones'&&!(deal&&phone)))&&(selected==='Tout'||groupFor(a)===selected)&&(subtopic==='Tous'||!topics[selected]||topicFor(a)===subtopic)&&[a.title,a.description,a.source].join(' ').toLocaleLowerCase().includes(q)});if(selected==='Tout'&&!q){const now=Date.now();const norm=t=>String(t||'').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const stop=new Set('avec pour dans cette sont plus moins apres avant leurs aussi nouveau nouvelle annonce lance devoile selon alors voici comment pourquoi tous toutes sans entre depuis vous nous elles ils elle des les une aux sur par est ont ete ses ces qui que quoi dont lors vers fait etre tech technologie actualite'.split(' '));const words=a=>new Set((norm(a.title).match(/[a-z0-9]{4,}/g)||[]).filter(w=>!stop.has(w)));const similarity=(a,b)=>{const x=words(a),y=words(b);let n=0;for(const w of x)if(y.has(w))n++;return n/Math.max(1,Math.min(x.size,y.size))};const dated=a=>new Date(a.date).getTime();const recent=data.filter(a=>Number.isFinite(dated(a))&&dated(a)<=now+3600000&&now-dated(a)<=36*3600000);const pool=recent.length>=3?recent:data;const impact=/cyberattaque|vulnerabilit|faille critique|lancement|devoile|annonce|accord|reglementation|rupture|production|investissement|avancee|percee|innovation|intelligence artificielle|robotique|automatisation|energie|semi.conducteur/i;const sources=new Set(pool.map(a=>a.source));const scored=a=>{const age=Math.max(0,(now-dated(a))/3600000);const fresh=Number.isFinite(age)?Math.max(0,20-20*age/36):0;const corroborated=new Set(pool.filter(b=>b!==a&&b.source!==a.source&&similarity(a,b)>=0.55).map(b=>b.source)).size;const views=Number(a.views??a.readCount??a.popularity);const popularity=Number.isFinite(views)&&views>0?Math.min(12,Math.log10(views+1)*3):0;const matchingTrend=trendSignals.find(t=>similarity(a,t)>=0.55);const external=matchingTrend?Math.min(8,Math.log1p(matchingTrend.points||0)):0;return fresh+Math.min(45,corroborated*15)+(impact.test(norm(a.title))?12:0)+popularity+external};const ranked=pool.slice().sort((a,b)=>scored(b)-scored(a));const top=[];for(const a of ranked){if(top.every(b=>similarity(a,b)<0.55)){top.push(a);if(top.length===3)break}}const urls=new Set(top.map(a=>a.url));data=[...top,...data.filter(a=>!urls.has(a.url))]}meta.textContent=`${data.length} articles`;sectionTitle.textContent=selected==='Tout'?'À ne pas manquer aujourd’hui':selected+(subtopic==='Tous'?'':' · '+subtopic);grid.innerHTML=data.length?data.slice(0,180).map((a,i)=>`<article class="card ${i===0?'featured':''}"><div class="tag">${safe(a.category)} · ${safe(a.source)}</div><h3>${safe(a.title)}</h3><p>${safe(a.description||'Lire l’article original pour en savoir plus.')}</p><footer><span>${safe(a.date ? new Date(a.date).toLocaleString('fr-FR', {
  timeZone: 'Europe/Paris',
  day: '2-digit',
  month: '2-digit',
  year: 'numeric',
  hour: '2-digit',
  minute: '2-digit'
}) : '')}</span><a href="${safe(a.url)}" target="_blank" rel="noopener noreferrer">Lire l’article ↗</a></footer></article>`).join(''):'<div class="empty">Aucun article dans cette rubrique pour le moment. La collecte automatique doit être activée dans GitHub Actions.</div>'}tabs.addEventListener('click',e=>{if(e.target.dataset.cat){selected=e.target.dataset.cat;subtopic='Tous';render()}});subtopics.addEventListener('click',e=>{if(e.target.dataset.topic){subtopic=e.target.dataset.topic;render()}});search.addEventListener('input',render);async function loadTrends(){try{const res=await fetch('https://hn.algolia.com/api/v1/search?tags=story&numericFilters=created_at_i>'+Math.floor(Date.now()/1000-86400)+'&hitsPerPage=100',{signal:AbortSignal.timeout(6500)});if(!res.ok)return;const d=await res.json();trendSignals=(d.hits||[]).filter(h=>h.title&&h.points>=10).map(h=>({title:h.title,points:h.points,comments:h.num_comments||0}));if(all.length)render()}catch(e){console.info('Signaux externes indisponibles : classement local conservé')}}loadTrends();fetch('./articles.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Fichier non disponible');return r.json()}).then(d=>{all=d.articles||[];render();if(!all.length)meta.textContent='Collecte en attente : lance le workflow GitHub Actions.'}).catch(()=>{meta.textContent='Actualités non encore collectées';grid.innerHTML='<div class="empty">Les articles seront disponibles après la première exécution de GitHub Actions.</div>';render()});</script></body></html>
