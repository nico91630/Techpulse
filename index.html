<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1222"><title>TechPulse | Actualités tech</title><style>:root{color-scheme:dark;--bg:#080d17;--panel:#111b2b;--border:#26354a;--muted:#9dafc6;--accent:#53d2ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#142c42 0,transparent 48%),var(--bg);color:#f0f5fb;font:15px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{padding:18px max(20px,calc((100vw - 1200px)/2));border-bottom:1px solid #233247;background:#0b1423dd;position:sticky;top:0;z-index:5;backdrop-filter:blur(18px)}h1{margin:0;font-size:25px;letter-spacing:-1.1px;font-weight:800}h1 span{color:var(--accent)}header p{margin:0;color:var(--muted);font-size:12px}.wrap{max-width:1200px;margin:auto;padding:26px 20px 70px}.hero{position:relative;overflow:hidden;border:1px solid #28455a;padding:34px 38px;border-radius:22px;background:linear-gradient(120deg,#17394b,#122238 60%,#101b30);margin-bottom:25px}.hero:after{content:'⚡';position:absolute;right:42px;top:-54px;font-size:190px;opacity:.09;transform:rotate(-13deg);pointer-events:none}.hero h2{font-size:clamp(26px,4vw,42px);line-height:1.15;letter-spacing:-1.4px;margin:0 0 12px;max-width:670px}.hero p{color:#b7cce0;margin:0;max-width:630px}.tabs{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 15px;scrollbar-width:thin;scrollbar-color:#38526a transparent}.tabs button{border:1px solid #30435a;background:#142136;color:#c8d7e7;padding:10px 16px;border-radius:12px;white-space:nowrap;cursor:pointer;font:600 13px system-ui;transition:.18s}.tabs button:hover{border-color:#53d2ed;color:white}.tabs button.active{background:#d8f7ff;border-color:#d8f7ff;color:#0a2030;box-shadow:0 3px 18px #53d2ed22}.search-wrap{position:relative;margin:8px 0 12px}.search-wrap:before{content:'⌕';position:absolute;left:17px;top:7px;font-size:27px;color:#8ba7c0;pointer-events:none}input{width:100%;padding:15px 18px 15px 49px;background:#101d2e;border:1px solid #34475d;border-radius:14px;color:white;font-size:15px;outline:none}input:focus{border-color:#53d2ed;box-shadow:0 0 0 3px #53d2ed18}input::placeholder{color:#8fa4bc}.meta{color:var(--muted);margin:20px 0 15px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:17px}.card{background:linear-gradient(160deg,#162337,#101a29);border:1px solid var(--border);border-radius:18px;padding:23px;display:flex;flex-direction:column;min-height:245px;transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);border-color:#47728a;box-shadow:0 15px 35px #0004}.tag{font-size:11px;color:#78d8ef;font-weight:800;letter-spacing:.4px;text-transform:uppercase}.card h3{font-size:18px;line-height:1.38;letter-spacing:-.35px;margin:13px 0 9px}.card p{color:#aebfd0;line-height:1.55;flex:1;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.card footer{display:flex;justify-content:space-between;align-items:center;color:#91a8bf;font-size:11px;gap:10px;border-top:1px solid #29384a;padding-top:14px;margin-top:13px}.card a{color:#7cdef4;text-decoration:none;font-size:12px;font-weight:750;white-space:nowrap}.card a:hover{text-decoration:underline}.empty{padding:30px;background:#142136;border:1px solid #30435a;border-radius:15px;color:#c8d5e5;grid-column:1/-1}.refresh{border:0;border-radius:9px;padding:10px 13px;background:#1c6ea7;color:white;cursor:pointer}@media(max-width:640px){header{padding:13px 17px}h1{font-size:23px}.wrap{padding:18px 14px 45px}.hero{padding:25px 22px;border-radius:17px;margin-bottom:18px}.hero:after{right:-5px;font-size:135px;top:-28px}.hero h2{font-size:28px;max-width:260px}.hero p{font-size:13px;max-width:270px}.grid{grid-template-columns:1fr;gap:12px}.card{min-height:205px;padding:20px}.tabs button{padding:10px 13px}.card h3{font-size:18px}}@media(prefers-reduced-motion:reduce){.card,.tabs button{transition:none}.card:hover{transform:none}}</style></head><body><header><h1>⚡ Tech<span>Pulse</span></h1><p>L'actualité technologique, sans bruit</p></header><main class="wrap"><section class="hero"><h2>L’essentiel de la tech. Sans le bruit.</h2><p>Innovations, automatisme, électricité, énergie et technologies qui comptent.</p></section><div class="tabs" id="tabs"></div><div class="search-wrap"><input id="search" aria-label="Rechercher les actualités" placeholder="Rechercher une marque, un sujet, une technologie…"></div><div class="meta" id="meta">Chargement des dernières actualités…</div><div id="articles" class="grid"></div></main><script>const cats=['Tout','IA','Smartphones','Informatique','Gaming','Domotique','Électricité','Énergie','Automatisme','Mobilité','Innovation','Électronique','Cybersécurité'];let selected='Tout',all=[];const tabs=document.querySelector('#tabs'),grid=document.querySelector('#articles'),meta=document.querySelector('#meta'),search=document.querySelector('#search');function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){tabs.innerHTML=cats.map(c=>`<button class="${selected===c?'active':''}" data-cat="${safe(c)}">${safe(c)}</button>`).join('');const q=search.value.toLocaleLowerCase();let data=all.filter(a=>{const t=[a.title,a.description].join(' ').toLocaleLowerCase();const deal=/bon plan|bons plans|promo|réduction|reduction|remise|soldes|code promo|offre flash|prix cassé|black friday/.test(t);const phone=/smartphone|téléphone|telephone|iphone|galaxy|pixel|xiaomi|oneplus|redmi|samsung|honor|poco/.test(t);const innovative=/nouveau|nouvelle|innovation|invention|prototype|percée|découverte|dévoile|lance|développ|technologie|révolution|premièr|record|brevet|robot|scientifi|quantique|fibre optique|batterie|processeur|capteur|matériau|matériel|équipement/i.test(a.title);const noise=/xavier niel|députés|taxe|impôt|politique|dirigeant|patron|forfait|black friday|bon plan|promo|soldes|meilleur|comparatif|guide d'achat|interview|publicité/i.test(a.title);const relevant=a.category!=='Innovation'||(innovative&&!noise);return relevant&&(selected!=='Tout'||(a.category!=='Gaming'&&!(deal&&phone)))&&(selected==='Tout'||a.category===selected)&&[a.title,a.description,a.source].join(' ').toLocaleLowerCase().includes(q)});meta.textContent=`${data.length} article(s) · ${all.length} au total`;grid.innerHTML=data.length?data.slice(0,180).map(a=>`<article class="card"><div class="tag">${safe(a.category)} · ${safe(a.source)}</div><h3>${safe(a.title)}</h3><p>${safe(a.description||'Lire l’article original pour en savoir plus.')}</p><footer><span>${safe(a.date ? new Date(a.date).toLocaleString('fr-FR', {
  timeZone: 'Europe/Paris',
  day: '2-digit',
  month: '2-digit',
  year: 'numeric',
  hour: '2-digit',
  minute: '2-digit'
}) : '')}</span><a href="${safe(a.url)}" target="_blank" rel="noopener noreferrer">Lire l’article ↗</a></footer></article>`).join(''):'<div class="empty">Aucun article dans cette rubrique pour le moment. La collecte automatique doit être activée dans GitHub Actions.</div>'}tabs.addEventListener('click',e=>{if(e.target.dataset.cat){selected=e.target.dataset.cat;render()}});search.addEventListener('input',render);fetch('./articles.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Fichier non disponible');return r.json()}).then(d=>{all=d.articles||[];render();if(!all.length)meta.textContent='Collecte en attente : lance le workflow GitHub Actions.'}).catch(()=>{meta.textContent='Actualités non encore collectées';grid.innerHTML='<div class="empty">Les articles seront disponibles après la première exécution de GitHub Actions.</div>';render()});</script></body></html>
