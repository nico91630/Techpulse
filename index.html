<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1222"><title>TechPulse | Actualités tech</title><style>*{box-sizing:border-box}body{margin:0;background:#09111f;color:#eaf2ff;font:15px system-ui,Arial}header{padding:22px max(20px,calc((100vw - 1100px)/2));background:#111f36;border-bottom:1px solid #263954}h1{margin:0;font-size:29px;letter-spacing:-1px}h1 span{color:#45caff}header p{color:#a8bbd3;margin:5px 0 0}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.hero{padding:28px;border-radius:18px;background:linear-gradient(110deg,#17355b,#0d2238);margin-bottom:18px}.hero h2{font-size:25px;margin:0 0 8px}.hero p{color:#bfd0e7;margin:0}input{width:100%;padding:14px;background:#15263d;border:1px solid #344864;border-radius:12px;color:white;font-size:16px;margin:16px 0}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.tabs button{border:1px solid #344864;background:#15263d;color:#d9e8f7;padding:10px 14px;border-radius:22px;white-space:nowrap;cursor:pointer}.tabs button.active{background:#1675bc;border-color:#1675bc;color:white}.meta{color:#a6bad2;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}.card{background:#13223a;border:1px solid #2b405a;border-radius:15px;padding:20px;display:flex;flex-direction:column;min-height:195px}.tag{font-size:12px;color:#6fd3ff;font-weight:700}.card h3{font-size:18px;line-height:1.35;margin:10px 0}.card p{color:#aabed5;line-height:1.5;flex:1}.card footer{display:flex;justify-content:space-between;align-items:center;color:#9bb0c9;font-size:12px;gap:8px}.card a{color:#67d6ff;text-decoration:none}.empty{padding:24px;background:#15263d;border-radius:12px;color:#c8d5e5}.refresh{border:0;border-radius:9px;padding:10px 13px;background:#1c6ea7;color:white;cursor:pointer}</style></head><body><header><h1>⚡ Tech<span>Pulse</span></h1><p>L'actualité technologique, sans bruit</p></header><main class="wrap"><section class="hero"><h2>Toute la tech, au même endroit.</h2><p>IA · Smartphones · Domotique · Électricité · Énergie · Automatisme et plus</p></section><div class="tabs" id="tabs"></div><input id="search" placeholder="Rechercher un sujet, une marque, une technologie…"><div class="meta" id="meta">Chargement des dernières actualités…</div><div id="articles" class="grid"></div></main><script>const cats=['Tout','IA','Smartphones','Informatique','Gaming','Domotique','Électricité','Énergie','Automatisme','Mobilité','Innovation','Électronique','Cybersécurité'];let selected='Tout',all=[];const tabs=document.querySelector('#tabs'),grid=document.querySelector('#articles'),meta=document.querySelector('#meta'),search=document.querySelector('#search');function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){tabs.innerHTML=cats.map(c=>`<button class="${selected===c?'active':''}" data-cat="${safe(c)}">${safe(c)}</button>`).join('');const q=search.value.toLocaleLowerCase();let data=all.filter(a=>(selected==='Tout'||a.category===selected)&&[a.title,a.description,a.source].join(' ').toLocaleLowerCase().includes(q));meta.textContent=`${data.length} article(s) · ${all.length} au total`;grid.innerHTML=data.length?data.slice(0,180).map(a=>`<article class="card"><div class="tag">${safe(a.category)} · ${safe(a.source)}</div><h3>${safe(a.title)}</h3><p>${safe(a.description||'Lire l’article original pour en savoir plus.')}</p><footer><span>${safe((a.date||'').slice(0,10))}</span><a href="${safe(a.url)}" target="_blank" rel="noopener noreferrer">Lire l’article ↗</a></footer></article>`).join(''):'<div class="empty">Aucun article dans cette rubrique pour le moment. La collecte automatique doit être activée dans GitHub Actions.</div>'}tabs.addEventListener('click',e=>{if(e.target.dataset.cat){selected=e.target.dataset.cat;render()}});search.addEventListener('input',render);fetch('./articles.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Fichier non disponible');return r.json()}).then(d=>{all=d.articles||[];render();if(!all.length)meta.textContent='Collecte en attente : lance le workflow GitHub Actions.'}).catch(()=>{meta.textContent='Actualités non encore collectées';grid.innerHTML='<div class="empty">Les articles seront disponibles après la première exécution de GitHub Actions.</div>';render()});</script></body></html>
