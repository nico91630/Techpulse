
name: Actualites automatiques

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecter les actualites
        run: python collect.py

      - name: Installer le modèle IA local gratuit
        run: pip install --disable-pip-version-check "transformers>=4.44,<5" "torch>=2.4,<3" sentencepiece

      - name: Générer les résumés IA locaux
        run: python scripts/local_ai_summaries.py

      - name: Résumés gratuits de secours
        run: python scripts/free_summaries.py

      - name: Enregistrer les articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour automatique des actualites"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
