
name: Actualites automatiques

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: techpulse-actualites-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecter les actualites
        run: python collect.py

      - name: Installer l'extracteur de texte
        run: pip install 'trafilatura>=1.12,<3'

      - name: Résumés gratuits de secours
        run: python scripts/free_summaries.py

      - name: Extraire et résumer les articles accessibles
        run: python scripts/full_article_summaries.py

      - name: Enregistrer les articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour automatique des actualites"
            for tentative in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Conflit de contenu : arrêt sans écraser les modifications."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Articles publiés (tentative $tentative)."
                exit 0
              fi
              echo "La branche a changé, nouvel essai ($tentative/5)."
              sleep $((tentative * 3))
            done
            echo "Publication impossible après 5 tentatives."
            exit 1
          fi
